<style>

<div id="setup-panel">

<script>
// ═══════════════════════════════════════════════════════
// GRID SVG TEMPLATE (solution view + blank-grid download)
// ═══════════════════════════════════════════════════════
// Grid: 9×9 cells of 60px = 540×540. Origin at (0,0). No margins.
// Thin cell lines: 60,120 | 240,300 | 420,480
// Thick box lines: 0,180,360,540
// Inner grid: white bg, thin cell lines (1.5), thick 3×3 dividers (4).
const GRID_INNER = `
  <rect x="0" y="0" width="540" height="540" fill="#ffffff"/>
  <line x1="0" y1="60"  x2="540" y2="60"  stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="60"  y1="0" x2="60"  y2="540" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="0" y1="120" x2="540" y2="120" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="120" y1="0" x2="120" y2="540" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="0" y1="240" x2="540" y2="240" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="240" y1="0" x2="240" y2="540" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="0" y1="300" x2="540" y2="300" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="300" y1="0" x2="300" y2="540" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="0" y1="420" x2="540" y2="420" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="420" y1="0" x2="420" y2="540" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="0" y1="480" x2="540" y2="480" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="480" y1="0" x2="480" y2="540" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="0" y1="180" x2="540" y2="180" stroke="#0a0a0a" stroke-width="4.0" stroke-linecap="square"/>
  <line x1="180" y1="0" x2="180" y2="540" stroke="#0a0a0a" stroke-width="4.0" stroke-linecap="square"/>
  <line x1="0" y1="360" x2="540" y2="360" stroke="#0a0a0a" stroke-width="4.0" stroke-linecap="square"/>
  <line x1="360" y1="0" x2="360" y2="540" stroke="#0a0a0a" stroke-width="4.0" stroke-linecap="square"/>
`;
// Outer frame: full 4px (inset rect, matches the inner 3×3 dividers).
const GRID_OUTER_BOLD = `<rect x="2" y="2" width="536" height="536" fill="none" stroke="#0a0a0a" stroke-width="4.0" stroke-linejoin="miter"/>`;
function gridMarkup() { return GRID_INNER + GRID_OUTER_BOLD; }

// Cell centre: x = 30 + col*60,  y = 30 + row*60
function cellX(col) { return 30 + col * 60; }
function cellY(row) { return 30 + row * 60; }

// ═══════════════════════════════════════════════════════
// SUDOKU ENGINE
// ═══════════════════════════════════════════════════════
function newGrid() { return Array.from({length:9}, () => new Array(9).fill(0)); }

function isValid(grid, row, col, num) {
  for (let c = 0; c < 9; c++) if (grid[row][c] === num) return false;
  for (let r = 0; r < 9; r++) if (grid[r][col] === num) return false;
  const br = Math.floor(row/3)*3, bc = Math.floor(col/3)*3;
  for (let r = br; r < br+3; r++)
    for (let c = bc; c < bc+3; c++)
      if (grid[r][c] === num) return false;
  return true;
}

function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function fillGrid(grid) {
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] === 0) {
        for (const n of shuffle([1,2,3,4,5,6,7,8,9])) {
          if (isValid(grid, r, c, n)) {
            grid[r][c] = n;
            if (fillGrid(grid)) return true;
            grid[r][c] = 0;
          }
        }
        return false;
      }
    }
  }
  return true;
}

function countSolutions(grid, limit=2) {
  let count = 0;
  function bt() {
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        if (grid[r][c] === 0) {
          for (let n = 1; n <= 9; n++) {
            if (isValid(grid, r, c, n)) {
              grid[r][c] = n; bt(); grid[r][c] = 0;
              if (count >= limit) return;
            }
          }
          return;
        }
      }
    }
    count++;
  }
  bt();
  return count;
}

function solve(puzzle) {
  const grid = puzzle.map(r => [...r]);
  function bt() {
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        if (grid[r][c] === 0) {
          for (let n = 1; n <= 9; n++) {
            if (isValid(grid, r, c, n)) {
              grid[r][c] = n;
              if (bt()) return true;
              grid[r][c] = 0;
            }
          }
          return false;
        }
      }
    }
    return true;
  }
  return bt() ? grid : null;
}

// Display name per difficulty key (the key stays "surreal" so ids and saved settings keep working)
const diffName = k => (k === 'surreal' ? 'master' : k);

const CLUE_RANGES = {
  easy:    [37, 39],
  medium:  [34, 36],
  hard:    [29, 32],
  extreme: [26, 28],
  surreal: [23, 25],
};

// How strongly clue removal keeps the puzzle balanced (1 = strictly even clues
// across boxes & digits, 0 = fully random). Easier levels stay very balanced
// for accessibility; harder levels stay loose to keep their character.
const BALANCE_BY_DIFFICULTY = {
  easy: 1.0, medium: 0.8, hard: 0.55, extreme: 0.3, surreal: 0.12,
};
// Per-puzzle variety: how far a puzzle may drift looser than baseline and how
// strong its clump/skew can get — keeps puzzles from all looking the same.
const VARIETY_BY_DIFFICULTY = {
  easy: 0.45, medium: 0.55, hard: 0.7, extreme: 0.8, surreal: 0.9,
};
const boxOf = (r, c) => (Math.floor(r / 3) * 3 + Math.floor(c / 3));

// Retry generatePuzzle until the clue count lands within [min, max].
// Returns null if it can't hit the range after maxAttempts tries.
function generatePuzzleInRange(difficulty, maxAttempts = 30) {
  const [min, max] = CLUE_RANGES[difficulty];
  for (let i = 0; i < maxAttempts; i++) {
    const result = generatePuzzle(difficulty);
    const clues  = result.puzzle.flat().filter(v => v !== 0).length;
    if (clues >= min && clues <= max) return result;
  }
  return null; // range unreachable — caller should report error
}

// Deliberate, balanced clue removal: each step removes the clue that most
// evens out the puzzle — cells in the fullest 3×3 box holding the most
// over-represented digit go first — so no box is left bare while another stays
// packed, and digits 1–9 stay evenly distributed. `balance` scales how much
// this matters vs. randomness. A cell whose removal breaks uniqueness is
// "blocked" and never re-tested (it can't become removable as clues thin out).
function generatePuzzle(difficulty) {
  const solution = newGrid();
  fillGrid(solution);
  const [minClues, maxClues] = CLUE_RANGES[difficulty];
  const targetClues = minClues + Math.floor(Math.random() * (maxClues - minClues + 1));
  const puzzle = solution.map(r => [...r]);

  // Per-puzzle "character": every other puzzle or so gets some flavour (looser
  // + a directional clump) so no two play the same; the rest keep the tight
  // baseline balance.
  const base    = BALANCE_BY_DIFFICULTY[difficulty] ?? 0.5;
  const variety = VARIETY_BY_DIFFICULTY[difficulty] ?? 0.6;
  let   balance = base;
  const boxBias = new Array(9).fill(0);
  if (Math.random() < 0.5) {
    balance = Math.max(0, base - Math.random() * variety);
    const gx = Math.random() * 2 - 1, gy = Math.random() * 2 - 1;
    const strength = (3 + Math.random() * 7) * variety;
    for (let b = 0; b < 9; b++) boxBias[b] = ((b % 3 - 1) * gx + ((b / 3 | 0) - 1) * gy) * strength;
    if (Math.random() < 0.4) boxBias[(Math.random() * 9) | 0] += strength;
  }
  const noise = (1 - balance) * 18 + 0.3;
  const blocked = new Set();
  let current = 81;

  while (current > targetClues) {
    const boxCount = new Array(9).fill(0), digitCount = new Array(10).fill(0);
    const filled = [];
    for (let i = 0; i < 81; i++) {
      const r = (i / 9) | 0, c = i % 9, v = puzzle[r][c];
      if (v !== 0) { boxCount[boxOf(r, c)]++; digitCount[v]++; if (!blocked.has(i)) filled.push(i); }
    }
    if (!filled.length) break;

    const scored = filled.map(p => {
      const r = (p / 9) | 0, c = p % 9;
      return { p, s: 2.0 * boxCount[boxOf(r, c)] + 1.0 * digitCount[puzzle[r][c]] + boxBias[boxOf(r, c)] + Math.random() * noise };
    });
    scored.sort((a, b) => b.s - a.s);

    let removed = false;
    for (const { p } of scored) {
      const r = (p / 9) | 0, c = p % 9, backup = puzzle[r][c];
      puzzle[r][c] = 0;
      if (countSolutions(puzzle.map(row => [...row]), 2) === 1) { current--; removed = true; break; }
      puzzle[r][c] = backup;
      blocked.add(p);
    }
    if (!removed) break;
  }
  return { puzzle, solution };
}

// ═══════════════════════════════════════════════════════
// PLAY STATE
// Cells are indexed 0..80 (row-major). notes[i] is a bitmask: bit n = candidate n.
// ═══════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const rowOf = i => (i / 9) | 0, colOf = i => i % 9, boxOfIdx = i => boxOf(rowOf(i), colOf(i));
const PEERS = Array.from({ length: 81 }, (_, i) => {
  const out = [];
  for (let j = 0; j < 81; j++)
    if (j !== i && (rowOf(j) === rowOf(i) || colOf(j) === colOf(i) || boxOfIdx(j) === boxOfIdx(i))) out.push(j);
  return out;
});

const play = { puzzle: null, solution: null, grid: new Array(81).fill(0), notes: new Array(81).fill(0), sel: -1, pencil: false, history: [], solved: false, difficulty: null };

function setStatus(msg, cls = '') {
  const el = $('status');
  el.textContent = msg;
  el.className = cls;
}

function startGame(puzzle, solution, difficulty) {
  play.puzzle = puzzle.flat();
  play.solution = solution.flat();
  play.grid = [...play.puzzle];
  play.notes = new Array(81).fill(0);
  play.sel = play.puzzle.findIndex(v => v === 0);
  play.history = [];
  play.solved = false;
  play.difficulty = difficulty;
  renderToSVGElement($('svg-solution'), puzzle, solution, true);
  setSolutionVisible(false);
  renderBoard();
}

function snapshot() {
  play.history.push({ g: [...play.grid], n: [...play.notes] });
  if (play.history.length > 500) play.history.shift();
}

function editable(i) { return i >= 0 && !play.solved && play.puzzle && play.puzzle[i] === 0; }

function placeNumber(n, asNote) {
  const i = play.sel;
  if (!editable(i)) return;
  if (asNote) {
    if (play.grid[i] !== 0) return;               // pencil marks only in empty cells
    snapshot();
    play.notes[i] ^= (1 << n);
  } else {
    if (play.grid[i] === n) return;
    snapshot();
    play.grid[i] = n;
    play.notes[i] = 0;
    for (const p of PEERS[i]) play.notes[p] &= ~(1 << n);   // clear this candidate from row/column/box
  }
  afterChange();
}

function erase() {
  const i = play.sel;
  if (!editable(i) || (play.grid[i] === 0 && play.notes[i] === 0)) return;
  snapshot();
  play.grid[i] = 0;
  play.notes[i] = 0;
  afterChange();
}

function undo() {
  if (play.solved || !play.history.length) return;
  const s = play.history.pop();
  play.grid = s.g;
  play.notes = s.n;
  afterChange();
}

function afterChange() {
  if (play.grid.every((v, k) => v === play.solution[k])) {
    play.solved = true;
    setStatus(`Solved ✓ — nicely done! (${diffLabel(play.difficulty)})`, 'ok');
  }
  renderBoard();
}

function togglePencil(force) {
  play.pencil = typeof force === 'boolean' ? force : !play.pencil;
  $('btn-pencil').setAttribute('aria-pressed', String(play.pencil));
}

function moveSel(dr, dc) {
  if (play.sel < 0) { play.sel = 0; renderBoard(); return; }
  const r = (rowOf(play.sel) + dr + 9) % 9, c = (colOf(play.sel) + dc + 9) % 9;
  play.sel = r * 9 + c;
  renderBoard();
}

// ═══════════════════════════════════════════════════════
// BOARD RENDERING
// ═══════════════════════════════════════════════════════
function renderBoard() {
  const sel = play.sel, selVal = sel >= 0 ? play.grid[sel] : 0;
  const peerSet = new Set(sel >= 0 ? PEERS[sel] : []);
  let html = '';
  for (let i = 0; i < 81; i++) {
    const r = rowOf(i), c = colOf(i), v = play.grid[i];
    const given = play.puzzle && play.puzzle[i] !== 0;
    const wrong = !given && v !== 0 && v !== play.solution[i];
    const cls = ['cell'];
    if (c === 2 || c === 5) cls.push('box-r');
    if (r === 2 || r === 5) cls.push('box-b');
    if (c === 8) cls.push('edge-r');
    if (r === 8) cls.push('edge-b');
    if (v !== 0 && !given) cls.push('user');
    if (peerSet.has(i)) cls.push('peer');
    if (selVal && v === selVal) cls.push('same');
    if (wrong) cls.push('wrong');
    if (i === sel) cls.push('sel');

    let inner = '';
    if (v) inner = String(v);
    else if (play.notes[i]) {
      inner = '<div class="notes">';
      for (let n = 1; n <= 9; n++) inner += `<span>${play.notes[i] & (1 << n) ? n : ''}</span>`;
      inner += '</div>';
    }
    let label = `Row ${r + 1}, column ${c + 1}, `;
    if (v) label += v + (given ? ', given' : '') + (wrong ? ', incorrect' : '');
    else {
      const ns = [1,2,3,4,5,6,7,8,9].filter(n => play.notes[i] & (1 << n));
      label += ns.length ? 'pencil marks ' + ns.join(' ') : 'empty';
    }
    html += `<div class="${cls.join(' ')}" role="gridcell" data-i="${i}" aria-label="${label}"${i === sel ? ' aria-selected="true"' : ''}>${inner}</div>`;
  }
  $('board').innerHTML = html;
}

// ═══════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════
$('board').addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  play.sel = +cell.dataset.i;
  renderBoard();
  $('board').focus({ preventScroll: true });
});

$('pad').addEventListener('click', e => {
  const b = e.target.closest('button[data-n]');
  if (b) placeNumber(+b.dataset.n, play.pencil);
});
$('btn-pencil').addEventListener('click', () => togglePencil());
$('btn-erase').addEventListener('click', erase);
$('btn-undo').addEventListener('click', undo);

document.addEventListener('keydown', e => {
  if (!play.puzzle) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
  if (e.altKey) return;
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey) return;

  const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
  if (m) { e.preventDefault(); placeNumber(+m[1], play.pencil !== e.shiftKey); return; }
  switch (e.key) {
    case 'Backspace': case 'Delete': case '0': e.preventDefault(); erase(); break;
    case 'ArrowUp':    e.preventDefault(); moveSel(-1, 0); break;
    case 'ArrowDown':  e.preventDefault(); moveSel(1, 0);  break;
    case 'ArrowLeft':  e.preventDefault(); moveSel(0, -1); break;
    case 'ArrowRight': e.preventDefault(); moveSel(0, 1);  break;
    case 'n': case 'N': togglePencil(); break;
  }
});

// ═══════════════════════════════════════════════════════
// SOLUTION TOGGLE
// ═══════════════════════════════════════════════════════
function setSolutionVisible(show) {
  $('solution-wrap').hidden = !show;
  $('btn-solution').setAttribute('aria-expanded', String(show));
  $('btn-solution').textContent = show ? 'Hide solution' : 'Show solution';
}
$('btn-solution').addEventListener('click', () => setSolutionVisible($('solution-wrap').hidden));

// ═══════════════════════════════════════════════════════
// SVG RENDERING (solution view)
// ═══════════════════════════════════════════════════════
function buildSVGContent(puzzle, solution, showSolution) {
  let texts = '';
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const v = puzzle[r][c];
      const x = cellX(c), y = cellY(r);
      if (v !== 0) {
        texts += `<text class="given" x="${x}" y="${y}">${v}</text>\n`;
      } else if (showSolution && solution) {
        texts += `<text class="solution" x="${x}" y="${y}">${solution[r][c]}</text>\n`;
      }
    }
  }
  return texts;
}

function renderToSVGElement(svgEl, puzzle, solution, showSolution) {
  svgEl.innerHTML = gridMarkup() + buildSVGContent(puzzle, solution, showSolution);
}

// ═══════════════════════════════════════════════════════
// GENERATE
// ═══════════════════════════════════════════════════════
const diffLabel = k => { const n = diffName(k); return n.charAt(0).toUpperCase() + n.slice(1); };

function generate() {
  const difficulty = $('difficulty').value;
  if (!validateRange(difficulty)) {
    setStatus(`Invalid clue range for ${diffName(difficulty)} — min must be ≤ max, between 17 and 80.`, 'fail');
    return;
  }
  $('btn-generate').disabled = true;
  setStatus(`Generating ${diffName(difficulty)} puzzle…`);
  setTimeout(() => {
    try {
      for (let attempt = 0; attempt < 5; attempt++) {
        const result = generatePuzzleInRange(difficulty);
        if (!result) {
          const [mn, mx] = CLUE_RANGES[difficulty];
          setStatus(`Could not reach ${mn}–${mx} clues for ${diffName(difficulty)} in 30 attempts. Try widening the range.`, 'fail');
          return;
        }
        const { puzzle, solution } = result;
        const check = solve(puzzle);
        if (!check || check.some((row, r) => row.some((v, c) => v !== solution[r][c]))) continue;
        startGame(puzzle, solution, difficulty);
        const clues = puzzle.flat().filter(v => v !== 0).length;
        setStatus(`${diffLabel(difficulty)} · ${clues} clues — good luck!`);
        return;
      }
      setStatus('Generation failed — try again.', 'fail');
    } catch (e) {
      setStatus('Error: ' + e.message, 'fail');
    } finally {
      $('btn-generate').disabled = false;
    }
  }, 10);
}
$('btn-generate').addEventListener('click', generate);

// ═══════════════════════════════════════════════════════
// BLANK GRID DOWNLOAD (SVG + PNG in a zip)
// ═══════════════════════════════════════════════════════
function svgToPng(svgString, scale) {
  return new Promise((resolve, reject) => {
    const size = 540 * scale;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const url = URL.createObjectURL(new Blob([svgString], { type: 'image/svg+xml' }));
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, size, size);
      URL.revokeObjectURL(url);
      canvas.toBlob(pngBlob => resolve(pngBlob), 'image/png');
    };
    img.onerror = reject;
    img.src = url;
  });
}

function loadJSZip() {
  return new Promise((resolve, reject) => {
    if (window.JSZip) { resolve(window.JSZip); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = () => resolve(window.JSZip);
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function downloadBlankGrid() {
  try {
    const JSZip = await loadJSZip();
    const zip = new JSZip();
    const svgStr = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="540" height="540">
${gridMarkup()}
</svg>`;
    zip.file('blank_grid.svg', svgStr);
    zip.file('blank_grid.png', await svgToPng(svgStr, 3));   // 1620px (~300 DPI print)
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'blank_grid.zip' });
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (e) {
    setStatus('Could not prepare the blank grid: ' + e.message, 'fail');
  }
}
$('btn-blank').addEventListener('click', downloadBlankGrid);

// ═══════════════════════════════════════════════════════
// CLUE RANGE UI + VALIDATION
// ═══════════════════════════════════════════════════════
// Called live on input — just update CLUE_RANGES and clear any error state.
// No auto-clamping: let the user type freely; we validate before generating.
function updateClueRange(difficulty) {
  const min = parseInt($(`cr-${difficulty}-min`).value, 10);
  const max = parseInt($(`cr-${difficulty}-max`).value, 10);
  if (!isNaN(min) && !isNaN(max)) CLUE_RANGES[difficulty] = [min, max];
  $(`cr-${difficulty}-min`).classList.remove('error');
  $(`cr-${difficulty}-max`).classList.remove('error');
}

// Returns true if valid, false + marks red if not.
function validateRange(difficulty) {
  const minEl = $(`cr-${difficulty}-min`), maxEl = $(`cr-${difficulty}-max`);
  const min = parseInt(minEl.value, 10), max = parseInt(maxEl.value, 10);
  const ok = !isNaN(min) && !isNaN(max) && min >= 17 && max <= 80 && min <= max;
  minEl.classList.toggle('error', !ok);
  maxEl.classList.toggle('error', !ok);
  return ok;
}

// Only the selected difficulty's clue range is shown.
function showClueRow() {
  const d = $('difficulty').value;
  document.querySelectorAll('.clue-row').forEach(row => { row.hidden = row.dataset.diff !== d; });
}
$('difficulty').addEventListener('change', showClueRow);

// ── Persistence: remember the difficulty + clue ranges ──
const DIFFS = ['easy', 'medium', 'hard', 'extreme', 'surreal'];
const COMPOSITION_KEY = 'sudoku_book_composition_v1';
const COMPOSITION_IDS = DIFFS.flatMap(d => [`cr-${d}-min`, `cr-${d}-max`]).concat('difficulty');

function saveComposition() {
  try {
    const vals = Object.fromEntries(COMPOSITION_IDS.map(id => [id, $(id).value]));
    localStorage.setItem(COMPOSITION_KEY, JSON.stringify(vals));
  } catch (e) { /* storage unavailable (e.g. private mode) — still works, just won't remember */ }
}

function loadComposition() {
  try {
    const vals = JSON.parse(localStorage.getItem(COMPOSITION_KEY) || 'null');
    if (!vals) return;
    for (const id of COMPOSITION_IDS) {
      const el = $(id);
      if (vals[id] == null) continue;
      if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === vals[id])) continue; // never leave the select empty
      el.value = vals[id];
    }
    DIFFS.forEach(updateClueRange);   // CLUE_RANGES is what generate() reads — resync it
  } catch (e) { /* corrupt or unavailable — keep the defaults */ }
}

// Reset = defaults straight from the markup (input defaultValue / the option marked `selected`).
function resetComposition() {
  if (!confirm('Reset the difficulty and clue ranges to the defaults?')) return;
  for (const id of COMPOSITION_IDS) {
    const el = $(id);
    el.value = el.tagName === 'SELECT'
      ? ([...el.options].find(o => o.defaultSelected) || el.options[0]).value
      : el.defaultValue;
  }
  DIFFS.forEach(updateClueRange);
  showClueRow();
  saveComposition();
}

const setupPanel = $('setup-panel');
setupPanel.addEventListener('input', saveComposition);
setupPanel.addEventListener('change', saveComposition);
$('btn-comp-reset').addEventListener('click', resetComposition);

// ── Init ──
loadComposition();
showClueRow();
renderBoard();
generate();   // a puzzle is ready to play as soon as the page opens
</script>
</body>
</html>
